    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #020617; /* Slate 950 */
        color: #f8fafc;
        overflow-x: hidden;
      }
      .font-display {
        font-family: 'Space Grotesk', sans-serif;
      }
      
      /* Custom Scrollbar */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: #0f172a; }
      ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #475569; }

      /* Print Specific Styles - CRITICAL FOR CARD PRINTING */
      @media print {
        @page {
          size: A4;
          margin: 1cm;
        }
        body {
          background-color: white !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
          color: black !important;
          overflow: visible !important;
        }
        /* Hide UI elements */
        .no-print, aside, header, .toolbar, .properties-panel, .verify-ui {
          display: none !important;
        }
        /* Show print container */
        .print-container {
          display: grid !important;
          grid-template-columns: repeat(2, 1fr); /* 2 Cards per row */
          gap: 1rem;
          width: 100%;
        }
        /* Prevent cards from breaking across pages */
        .card-pair-wrapper {
          break-inside: avoid;
          page-break-inside: avoid;
          margin-bottom: 1rem;
          border: 1px dashed #ccc; /* Cut lines if enabled */
        }
        .card-pair-wrapper.no-border {
          border: none;
        }
      }
    </style>
